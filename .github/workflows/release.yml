name: Release

# Builds release binaries and publishes a GitHub Release when a `vX.Y.Z` tag
# is pushed. Never runs on a normal push or PR — see ci.yml for that.
#
# Also runnable by hand (workflow_dispatch): same build, same release, but
# the tag (`v` + Cargo.toml's version) is *created by* the release step at
# this run's commit instead of arriving as the trigger. Exists because a
# release isn't always prepared somewhere that can push refs/tags/* — the
# v0.1.7 release was staged by credentials that could merge PRs but not
# push tags. Dispatch from the commit to be released (normally main's HEAD,
# right after the version-bump PR lands).
#
# **The button releases Cargo.toml's version at the commit you dispatch
# from — it does not pick a version for you.** Dispatching before the
# version bump has merged is refused by `preflight` below rather than
# quietly re-publishing the previous release; see that job for the incident
# that rule exists for.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Dispatch-only gate, and the reason it exists is a real incident.
  #
  # A dispatch releases whatever version `Cargo.toml` names *at the commit
  # you dispatch from*. If that version is already released, the publish
  # step below does not refuse — `action-gh-release` updates the existing
  # release in place. So clicking "Run workflow" before the version-bump PR
  # has merged does not no-op: it rebuilds the binaries from the current
  # commit and **overwrites the published artifacts of the previous
  # release**, green and silent.
  #
  # That happened on 2026-09-02: a dispatch at d90bfd7 replaced every
  # v0.1.16 tarball (the tag points at c714b60, five commits earlier), so
  # the published v0.1.16 shipped code that was never in v0.1.16 — and the
  # regenerated SHA256SUMS.txt made it self-consistent, which is what kept
  # it invisible.
  #
  # `release-request.yml` already refuses in this situation. The button
  # bypassed that check because the check lived in the requester rather
  # than here. It lives here now, so both routes are guarded.
  #
  # Always runs, so `build` can plainly `needs` it: on a tag push the step
  # is skipped (a tag push has a tag by definition, and the version match
  # is checked in `build` instead) and the job still succeeds.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to re-release a version that is already tagged
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          if git ls-remote --exit-code origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "::error title=v${version} is already released::Cargo.toml at this commit says ${version}, and v${version} is already tagged. Continuing would overwrite that release's published artifacts with binaries built from this commit. Merge the version-bump PR first, then dispatch again (or just touch .github/release-request and let release-request.yml do it)."
            exit 1
          fi
          echo "v${version} is not yet tagged — proceeding."

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Native arm64 runner (GA on public repos since early 2025) rather
          # than cross-compiling — one less moving part.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Cheap guard against shipping a binary whose --version-equivalent
      # (the crate version baked into the tarball name) doesn't match what
      # was actually tagged — a mismatch here would silently break the
      # cargo-binstall pkg-url template in Cargo.toml. Only meaningful on a
      # tag push: a dispatch run *derives* its tag from Cargo.toml, so there
      # is nothing for the crate version to disagree with.
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version $crate_version"
            exit 1
          fi

      - run: rustup target add ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        # Binaries are already stripped by `[profile.release] strip = true`
        # in Cargo.toml — no separate strip step needed here.
        run: |
          set -euo pipefail
          # The crate version, not the ref name: identical on a tag push
          # (the guard above), and the only version there is on a dispatch.
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          pkg="roost-${version}-${{ matrix.target }}"
          mkdir "$pkg"
          cp "target/${{ matrix.target }}/release/roost" "$pkg/"
          cp LICENSE README.md "$pkg/"
          tar czf "${pkg}.tar.gz" "$pkg"
          shasum -a 256 "${pkg}.tar.gz" > "${pkg}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: |
            roost-*.tar.gz
            roost-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Absent → the Homebrew-tap sync step is skipped (fork/unconfigured
      # repos still release cleanly). A fine-grained PAT with contents:write
      # on navbytes/homebrew-tap — the same secret vee's release workflow
      # uses. See packaging/README.md.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      # Checkout first — it wipes the workspace, and the sync step below
      # needs scripts/ from the repo.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Combine per-target checksums into one file
        working-directory: dist
        run: cat -- *.tar.gz.sha256 > SHA256SUMS.txt

      # The tag being released — the pushed tag, or (dispatch) `v` + the
      # crate version, which action-gh-release below then creates at this
      # run's commit. Written to GITHUB_ENV so the release and formula-sync
      # steps read the same answer.
      - name: Resolve release tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
            echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          fi

      # No artifact signing yet.
      # TODO: sign release artifacts (e.g. cosign or minisign) once a
      # signing key is provisioned.
      - uses: softprops/action-gh-release@v3
        with:
          # Explicit on both paths; on a dispatch run this is what creates
          # the tag (at this run's commit) rather than expecting one.
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Keep navbytes/homebrew-tap tracking this release: render
      # Formula/roost.rb from dist/SHA256SUMS.txt and push it to the tap.
      # Skipped when HOMEBREW_TAP_TOKEN is unset (see the job env above).
      # RELEASE_TAG arrives from the resolve step's GITHUB_ENV.
      - name: Sync Homebrew formula (navbytes/homebrew-tap)
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: bash scripts/update-homebrew-formula.sh

      # The skip above must be LOUD, not silent: v0.1.6 and v0.1.7 both
      # released green while the tap quietly stayed behind (the secret has
      # never been configured), and the gap only surfaced when a brew
      # install served the old version. A warning annotation on the run's
      # summary makes "release ok, tap NOT synced" readable at a glance.
      - name: Warn that the tap was NOT synced
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "::warning title=Homebrew tap not synced::HOMEBREW_TAP_TOKEN is unset, so Formula/roost.rb in navbytes/homebrew-tap was NOT updated for ${RELEASE_TAG}. Add the secret (fine-grained PAT, contents:write on navbytes/homebrew-tap — see packaging/README.md) or sync by hand (scripts/update-homebrew-formula.sh)."

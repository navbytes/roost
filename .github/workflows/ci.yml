name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Supersede a still-running check when a newer commit lands on the same PR
# branch — a force-push during iteration is the common case, and the older
# run's result is already stale. main is exempt (cancel-in-progress is false
# there): every merge is verified to completion, even two landing back-to-back.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          endpoint="repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          gh api "$endpoint" > "$RUNNER_TEMP/pr-before.json"
          if ! jq -e --arg head "$PR_HEAD" --arg base "$PR_BASE" '.head.sha == $head and .base.sha == $base' "$RUNNER_TEMP/pr-before.json" >/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          total=$(jq -er '.changed_files' "$RUNNER_TEMP/pr-before.json")
          gh api --paginate --slurp "$endpoint/files" > "$RUNNER_TEMP/changed-files.json"
          gh api "$endpoint" > "$RUNNER_TEMP/pr-after.json"
          if ! jq -e --arg head "$PR_HEAD" --arg base "$PR_BASE" '.head.sha == $head and .base.sha == $base' "$RUNNER_TEMP/pr-after.json" >/dev/null; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          value=$(jq --argjson total "$total" 'add | if length == 0 or length != $total then true else any(.[]; ([.filename, (.previous_filename // .filename)] | any(.[]; test("^(docs/.*\\.md|[^/]+\\.md|LICENSE)$") | not))) end' "$RUNNER_TEMP/changed-files.json")
          echo "code=$value" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pinned, and pinned *here only*. `-D warnings` against a moving `stable`
    # means a clippy release can turn a green branch red with no code change,
    # and — the way this was actually found — a developer whose local
    # toolchain has drifted cannot reproduce the failure at all. Two lints
    # this repo now passes (`sort_by_key`, `needless_return` on the Linux-only
    # half of `infra::qos`) simply do not exist in clippy 0.1.89.
    #
    # Deliberately not a repo-wide `rust-toolchain.toml`: that would also pin
    # what `cargo build`, the test matrix and — worst — `release.yml`'s
    # four-target build compile with, and the release path is the one thing
    # here that cannot be rehearsed. Lint determinism is worth a pin; build
    # determinism is not worth that risk. Bump this when a new stable lands
    # and its findings have been dealt with; nothing else moves with it.
    env:
      LINT_TOOLCHAIN: "1.96.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install "$LINT_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      # `--check` rather than a formatting commit: CI reports, it does not
      # rewrite. The house style lives in `rustfmt.toml`, which documents why
      # its two settings are what they are.
      - run: cargo "+$LINT_TOOLCHAIN" fmt --check
      # `-D warnings` is what makes `Cargo.toml`'s `[lints]` tables binding.
      # `--all-targets` so tests and integration tests are linted too — the
      # PTY harness under `tests/` is real code that drives the real binary,
      # and it has caught real bugs. `vendor/vt100` is a path dependency
      # rather than a workspace member, so clippy never reaches it, which is
      # deliberate: it is third-party code carrying roost patches.
      - run: cargo "+$LINT_TOOLCHAIN" clippy --all-targets -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    # Both, deliberately: the PTY integration tests under tests/ drive the real
    # binary through a real pty, and several have only ever been run on one
    # developer's Mac. Two OSes is what tells a product bug apart from a host
    # quirk — which is the whole reason this workflow exists.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No toolchain action and no cache: GitHub runners ship rustup + a
      # current stable, and a cold build of this tree is well under a minute.
      - run: cargo build --tests --verbose
      # --no-fail-fast so one red integration test doesn't hide the others;
      # the point of a first CI run is the full picture, not the first failure.
      #
      # The echo budget is loosened on macOS only. GitHub's macOS runners are
      # throttled shared VMs, and tests/firehose.rs's 250 ms per-keystroke
      # bound failed about half its runs there on latency alone — passing on
      # Linux, on this repo's dev Mac, and here too, just not reliably. 1 s
      # still fails hard on the starvation class the gate exists for (the
      # defect it was written against blocked echoes for seconds), and the
      # test prints its p50/max every run, so creep stays visible. Anywhere
      # the variable is unset — Linux CI, any developer's machine — the
      # shipped 250 ms applies.
      #
      # `--show-output` because libtest captures a passing test's output, and
      # the numbers worth keeping — firehose's echo-latency p50/max, its exit
      # time — are produced on the runs that pass. Without it they were only
      # ever visible on the way to a panic, which is the one run where they
      # add nothing.
      - run: cargo test --no-fail-fast --verbose -- --show-output
        env:
          ROOST_TEST_ECHO_BUDGET_MS: ${{ matrix.os == 'macos-latest' && '1000' || '' }}

  result:
    name: ${{ github.workflow }} result
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [changes, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['changes']['result'] == 'success', 'Change detection did not succeed'
          assert all(job['result'] in ('success', 'skipped') for job in results.values()), results
          PYTHON

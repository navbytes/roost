version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      routine:
        applies-to: version-updates
        patterns: ["*"]
    open-pull-requests-limit: 1
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      routine:
        applies-to: version-updates
        patterns: ["*"]
    open-pull-requests-limit: 1
